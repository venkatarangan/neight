repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
        # .gitattributes deliberately checks .bat and .ps1 out as CRLF so they
        # run natively on Windows.  Without this exclusion the hook rewrites
        # them to LF in the working tree on every commit, fighting the checkout
        # rule — which is exactly what happened to buildme.bat.
        exclude: '\.(bat|ps1)$'

  - repo: local
    hooks:
      - id: tamil-spelling-guard
        name: Tamil Spelling Guard
        language: pygrep
        entry: "சோல்வெளி"
        args: [--multiline]
        types_or: [python, html]
        exclude: '^constants/tamil\.py$'
