name: Release assets check

# Guards against exactly the bug fixed in commit 602fc84: the website and
# README link to https://github.com/.../releases/latest/download/<file>,
# which silently 404s for a platform whenever the "latest" release is
# missing that platform's asset (e.g. a signed macOS build published before
# the Windows build lands in the same release, or vice versa). Since the two
# release scripts run on separate machines at separate times and asset
# uploads don't fire a new "release" webhook event, a schedule is what
# actually catches the gap — checking only at publish time would miss the
# asset that gets added an hour (or a day) later.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}
  release:
    types: [published]

jobs:
  check-latest-release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the Latest release has both platform assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          TAG=$(gh release view --repo "$REPO" --json tagName -q .tagName)
          ASSETS=$(gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name')

          echo "Latest release: $TAG"
          echo "Assets:"
          echo "$ASSETS"

          missing=0

          if ! echo "$ASSETS" | grep -qx "Neight.exe"; then
            echo "::error::Latest release ($TAG) is missing Neight.exe — the Windows download link on the website/README will 404."
            missing=1
          fi

          if ! echo "$ASSETS" | grep -qx "Neight-mac-arm64-signed.zip"; then
            echo "::error::Latest release ($TAG) is missing Neight-mac-arm64-signed.zip — the macOS download link on the website/README will 404."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Fix: run the missing platform's release script (release_macos.sh"
            echo "or release_windows.ps1) so both assets are attached to $TAG."
            exit 1
          fi

          echo "OK: $TAG has both required assets."
