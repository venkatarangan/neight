name: Download links check

# Guards against the download links on the website/README 404ing.
#
# Both direct downloads are served from the `dist-latest` branch, which every
# build republishes by amending its single commit and force-pushing (see
# DEVELOPER.md → "The dist-latest branch"). Stable installs go through the
# stores instead — Microsoft Store now, Mac App Store once approved — so the
# GitHub Releases assets no longer back any download button and are not
# checked here.
#
# What this catches: the branch being renamed or deleted, a publish step that
# silently failed, or an artifact being renamed by a change to the build
# scripts. Any of those turn the public download links into a 404, and a
# force-pushed branch has no history to notice it from.
#
# A schedule is what actually catches drift — checking only on push would miss
# a branch that breaks later, since builds are published from developer
# machines rather than from CI.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  check-download-links:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the dist-latest download links resolve
        run: |
          set -euo pipefail

          BASE="https://raw.githubusercontent.com/venkatarangan/neight/dist-latest/dist"
          missing=0

          check() {
            local name="$1" url="$BASE/$1" platform="$2"
            # -I fetches headers only, so this does not pull ~50 MB per run;
            # -L follows the redirect raw.githubusercontent issues.
            if code=$(curl -sIL -o /dev/null -w '%{http_code}' "$url") && [ "$code" = "200" ]; then
              echo "OK: $name ($platform) → HTTP $code"
            else
              echo "::error::$name is not reachable on dist-latest (HTTP ${code:-000}) — the $platform download link on the website/README will 404."
              missing=1
            fi
          }

          check "Neight.exe" "Windows"
          check "Neight-mac-arm64-unsigned.app.zip" "macOS"

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Fix: re-run the missing platform's build (buildme.bat on Windows,"
            echo "./buildme_mac_app.sh on macOS). Each publishes to dist-latest as its"
            echo "last step. If an artifact was deliberately renamed, update the names"
            echo "here and the links in docs/index.html, README.md and ADVANCED.md."
            exit 1
          fi

          echo "OK: both dist-latest download links resolve."
