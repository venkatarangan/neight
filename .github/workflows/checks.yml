name: Checks

on: [push, pull_request]

jobs:
  # The application imports PySide6 at module scope, so "does it even parse and
  # import" needs a real Qt install and an offscreen platform plugin. Runs on
  # ubuntu-latest only -- there is no per-platform matrix here, so a Windows-
  # or macOS-only regression will not be caught in CI. Run the regression
  # suite locally on the platform you're changing before pushing; see
  # DEVELOPER.md's "Regression suite" section.
  import-and-construct:
    name: Import and construct
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the interpreter release builds use, so CI exercises the
          # Python that actually ships.  See DEVELOPER.md -- release builds
          # additionally require the python.org build of it, for its low
          # macOS deployment floor, which setup-python does not guarantee.
          python-version: '3.14'

      # PySide6's wheel bundles Qt but not the system libraries Qt links
      # against, and the ubuntu-latest image does not carry libEGL.  Without
      # this every run died on "import neight" with
      # "ImportError: libEGL.so.1: cannot open shared object file" -- before
      # reaching a single test, so the suite silently stopped running for days
      # while the job merely looked broken.  QT_QPA_PLATFORM=offscreen avoids
      # needing an X server, not the libraries Qt is linked to.
      - name: Install the system libraries Qt links against
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Syntax check
        run: python -c "import ast, io; ast.parse(io.open('neight.py', encoding='utf-8').read()); print('syntax OK')"

      - name: Import and construct the main window offscreen
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: |
          python -c "
          import sys
          import neight
          app = neight.NeightApplication(sys.argv)
          win = neight.Notepad(initial_file=None, restore_last_session=False)
          assert win.editor is not None
          print('constructed OK on', sys.platform)
          "

      # These live in tests/ rather than inline here so they can be run locally
      # too -- the only way a Windows- or macOS-only regression gets noticed,
      # since this job only runs on ubuntu-latest.
      - name: Regression suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: |
          python tests/test_startup_settings.py
          python tests/test_text_integrity.py
          python tests/test_cursor_layout.py
          python tests/test_input_gestures.py
          python tests/test_selection_counts.py
          python tests/test_unsaved_prompt.py
          python tests/test_sandbox_qt_io.py
          python tests/test_document_lock.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the interpreter release builds use, so CI exercises the
          # Python that actually ships.  See DEVELOPER.md -- release builds
          # additionally require the python.org build of it, for its low
          # macOS deployment floor, which setup-python does not guarantee.
          python-version: '3.14'
      - name: Install Ruff
        run: pip install ruff
      # Report only.  CI must never rewrite source: an automatic fix could
      # silently alter a Tamil string literal.
      - name: Ruff (report only, no fixes)
        run: ruff check --no-fix --output-format=github . || true

  encoding-guards:
    name: Encoding and Tamil guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No UTF-8 BOM in tracked text files
        run: |
          bad=0
          while IFS= read -r f; do
            if head -c 3 "$f" | grep -q $'\xef\xbb\xbf'; then
              echo "::error file=$f::file starts with a UTF-8 BOM"
              bad=1
            fi
          done < <(git ls-files '*.py' '*.md' '*.html' '*.txt' '*.yml' '*.spec')
          exit $bad

      # Was its own workflow (tamil-guard.yml) doing one grep on an older
      # checkout action.  Same check, same scope as the pre-commit hook of the
      # same name -- python and html -- kept here because pre-commit only
      # protects contributors who ran `pre-commit install`.
      - name: Tamil spelling (no long-vowel corruption of சொல்வெளி)
        run: |
          # -F, a literal match: the pattern is a fixed string, so this needs no
          # PCRE and runs identically under BSD grep on a maintainer's Mac and
          # GNU grep on the runner.  The old workflow used -P, which macOS grep
          # does not support at all -- it could only ever be checked in CI.
          if git ls-files -z '*.py' '*.html' | xargs -0 grep -nF "சோல்வெளி"; then
            echo "::error::Wrong Tamil found: சோல்வெளி — use சொல்வெளி (short ொ)"
            exit 1
          fi
          echo "Tamil spelling check passed."

      - name: Tamil source strings decode as UTF-8
        run: |
          python - <<'PY'
          import subprocess, sys
          # -z, split on NUL: several tracked files have spaces in their names,
          # and git otherwise quote-escapes non-ASCII paths.
          out = subprocess.check_output(
              ['git', 'ls-files', '-z', '*.py', '*.md', '*.html'])
          files = [f for f in out.decode('utf-8').split('\0') if f]
          bad = []
          for f in files:
              try:
                  open(f, encoding='utf-8').read()
              except UnicodeDecodeError as exc:
                  bad.append(f'{f}: {exc}')
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          print(f'{len(files)} files decode cleanly as UTF-8')
          PY
