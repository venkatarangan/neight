name: Checks

on: [push, pull_request]

jobs:
  # The application imports PySide6 at module scope, so "does it even parse and
  # import" needs a real Qt install and an offscreen platform plugin.  Running it
  # on both target platforms is what catches a change that only compiles on one.
  import-and-construct:
    name: Import and construct (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Syntax check
        run: python -c "import ast, io; ast.parse(io.open('neight.py', encoding='utf-8').read()); print('syntax OK')"

      - name: Import and construct the main window offscreen
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: |
          python -c "
          import sys
          import neight
          app = neight.NeightApplication(sys.argv)
          win = neight.Notepad(initial_file=None, restore_last_session=False)
          assert win.editor is not None
          print('constructed OK on', sys.platform)
          "

      # These live in tests/ rather than inline here so they can be run locally,
      # which is the only way a change that breaks one gets noticed before it is
      # pushed.  The startup guard was previously an inline heredoc: PowerShell
      # is the default shell on the Windows runner and could not parse it, so
      # that half of the matrix had never actually executed the check.
      - name: Regression suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: |
          python tests/test_startup_settings.py
          python tests/test_text_integrity.py
          python tests/test_cursor_layout.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: pip install ruff
      # Report only.  CI must never rewrite source: an automatic fix could
      # silently alter a Tamil string literal.
      - name: Ruff (report only, no fixes)
        run: ruff check --no-fix --output-format=github . || true

  encoding-guards:
    name: Encoding and Tamil guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No UTF-8 BOM in tracked text files
        run: |
          bad=0
          while IFS= read -r f; do
            if head -c 3 "$f" | grep -q $'\xef\xbb\xbf'; then
              echo "::error file=$f::file starts with a UTF-8 BOM"
              bad=1
            fi
          done < <(git ls-files '*.py' '*.md' '*.html' '*.txt' '*.yml' '*.spec')
          exit $bad

      - name: Tamil source strings decode as UTF-8
        run: |
          python - <<'PY'
          import subprocess, sys
          # -z, split on NUL: several tracked files have spaces in their names,
          # and git otherwise quote-escapes non-ASCII paths.
          out = subprocess.check_output(
              ['git', 'ls-files', '-z', '*.py', '*.md', '*.html'])
          files = [f for f in out.decode('utf-8').split('\0') if f]
          bad = []
          for f in files:
              try:
                  open(f, encoding='utf-8').read()
              except UnicodeDecodeError as exc:
                  bad.append(f'{f}: {exc}')
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          print(f'{len(files)} files decode cleanly as UTF-8')
          PY
